name: Temporary generate Gradle 8.10.2 wrapper

on:
  push:
    branches:
      - release/reconcile-2026-08-15
    paths:
      - .github/workflows/tmp-generate-wrapper.yml

permissions:
  contents: read

jobs:
  generate-wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate wrapper with Gradle 8.10.2
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin
      - name: Verify generated wrapper target
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip' gradle/wrapper/gradle-wrapper.properties
          test -s gradlew
          test -s gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          sha256sum gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties
      - name: Upload wrapper provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradle-8.10.2-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
